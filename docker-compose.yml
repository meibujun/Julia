# Docker Compose file for local development environment
version: '3.8'

services:
  api:
    build:
      context: ./backend # Assumes a 'backend' directory exists at the root
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/animalgenetics
      - REDIS_URL=redis://cache:6379
      - JWT_SECRET=${JWT_SECRET} # Should be provided via .env file for local dev
    depends_on:
      - db
      - cache
    volumes:
      - ./backend:/app # Mount local backend code for live reloading

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=animalgenetics
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console UI port
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
