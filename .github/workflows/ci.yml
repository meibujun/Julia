name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Run tests daily at midnight UTC
    - cron: '0 0 * * *'

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'  # Latest stable
          - 'nightly'
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        arch:
          - x64
        exclude:
          # Exclude some combinations to reduce CI time
          - os: macOS-latest
            version: 'nightly'
          - os: windows-latest
            version: 'nightly'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Cache Julia packages
        uses: actions/cache@v3
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ matrix.version }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-${{ matrix.version }}-
            ${{ runner.os }}-julia-

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
        with:
          project: GenomicPro2

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          project: GenomicPro2
          coverage: true

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: matrix.os == 'ubuntu-latest' && matrix.version == '1'
        with:
          file: lcov.info
          flags: unittests
          name: codecov-umbrella

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1'

      - name: Install dependencies
        run: |
          julia --project=GenomicPro2/docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'

      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          julia --project=GenomicPro2/docs GenomicPro2/docs/make.jl

  python-package:
    name: Python Package Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./GenomicPro2/python[dev]
          python -c "import julia; julia.install()"

      - name: Run Python tests
        run: |
          cd GenomicPro2/python
          pytest --cov=genomicpro2 --cov-report=xml

      - name: Upload Python coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./GenomicPro2/python/coverage.xml
          flags: python
          name: python-tests

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./GenomicPro2
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            genomicpro2/genomicpro2:latest
            genomicpro2/genomicpro2:${{ github.sha }}
          cache-from: type=registry,ref=genomicpro2/genomicpro2:buildcache
          cache-to: type=registry,ref=genomicpro2/genomicpro2:buildcache,mode=max

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1'

      - name: Install JuliaFormatter
        run: julia -e 'using Pkg; Pkg.add("JuliaFormatter")'

      - name: Check code formatting
        run: julia -e 'using JuliaFormatter; format("GenomicPro2/src", verbose=true) || exit(1)'

      - name: Install Lint tools
        run: julia -e 'using Pkg; Pkg.add("Lint")'

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: '1'

      - name: Run benchmarks
        run: |
          cd GenomicPro2
          julia --project=. test/benchmark.jl

      - name: Store benchmark results
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: GenomicPro2/benchmark_results.json
