# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11' # Matches the project's development version
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        arch:
          - x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-

      - name: Install dependencies
        run: julia --project=GenomicPrediction -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        run: julia --project=GenomicPrediction -e 'using Pkg; Pkg.test()'
